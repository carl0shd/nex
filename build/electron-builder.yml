appId: com.nex.app
productName: Nex
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vite.config.ts,lint-rules/*,.changeset/*,.github/*,CHANGELOG.md,README.md,AGENTS.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - build/**
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
  - helpers/speech/bin/**
afterSign: scripts/resign.js
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSMicrophoneUsageDescription: Nex uses the microphone to dictate messages to the agent.
    - NSSpeechRecognitionUsageDescription: Nex uses speech recognition to transcribe dictated messages.
    - NSDocumentsFolderUsageDescription: Nex opens the projects and worktrees you keep in your Documents folder.
    - NSDownloadsFolderUsageDescription: Nex opens the projects and worktrees you keep in your Downloads folder.
  notarize: false
dmg:
  artifactName: ${name} ${version}.${ext}
npmRebuild: false
