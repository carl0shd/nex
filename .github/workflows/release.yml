name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app:
        description: Build the macOS app again for the current version (for a build that failed)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  version:
    name: Version or tag
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm exec changeset git-tag
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  app:
    name: Build the macOS app
    needs: version
    if: needs.version.outputs.published == 'true' || inputs.app
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The install only warns when the speech helper fails to build; a release must not ship without it.
      - name: Check the speech helper
        run: test -x "helpers/speech/bin/Nex Speech.app/Contents/MacOS/Nex Speech"

      - run: pnpm build:mac

      - name: Attach the app to the GitHub release
        run: gh release upload "v${VERSION}" dist/*.dmg --clobber
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
